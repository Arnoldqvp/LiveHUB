<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>liveHUB</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#07080d;
    --panel:rgba(15,17,25,.78);
    --panel2:rgba(21,24,35,.92);
    --line:rgba(255,255,255,.08);
    --text:#f4f5fa;
    --muted:#73798b;
    --accent:#8b6cff;
    --accent2:#48d8ff;
    --green:#65e7ad;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(139,108,255,.10),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(72,216,255,.07),
            transparent 30%
        ),
        var(--bg);
    color:var(--text);
    font-family:
        Inter,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
}

/* BACKGROUND */

.bg{
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    overflow:hidden;
}

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(100px);
    opacity:.16;
    animation:float 18s ease-in-out infinite alternate;
}

.orb1{
    width:300px;
    height:300px;
    background:#7550ff;
    top:-180px;
    left:-100px;
}

.orb2{
    width:280px;
    height:280px;
    background:#20cfff;
    bottom:-170px;
    right:-100px;
    animation-delay:-8s;
}

@keyframes float{
    to{
        transform:translate(80px,-50px) scale(1.15);
    }
}

/* HEADER */

.header{
    height:62px;
    padding:0 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:20px;
    font-weight:900;
    letter-spacing:-.8px;
}

.logo span{
    background:linear-gradient(
        90deg,
        var(--accent),
        var(--accent2)
    );
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.connection{
    display:flex;
    align-items:center;
    gap:7px;
    color:var(--muted);
    font-size:9px;
    letter-spacing:1px;
}

.connection i{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 12px var(--green);
}

/* MAIN */

.main{
    height:calc(100vh - 62px);
    padding:10px 24px 22px;
    display:flex;
    justify-content:center;
}

.layout{
    width:min(1260px,100%);
    height:100%;
    display:grid;
    grid-template-columns:minmax(0,1fr) 280px;
    gap:12px;
}

/* PLAYER */

.playerShell{
    position:relative;
    min-width:0;
    min-height:0;
    overflow:hidden;
    background:#020307;
    border:1px solid var(--line);
    border-radius:24px;
    box-shadow:0 30px 80px rgba(0,0,0,.4);
}

#player{
    position:absolute;
    inset:0;
}

#player iframe,
#player video{
    width:100%;
    height:100%;
    border:0;
    display:block;
}

#player video{
    background:#000;
    object-fit:contain;
}

/* TOP PLAYER BAR */

.playerTop{
    position:absolute;
    z-index:20;
    top:13px;
    left:13px;
    right:13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    pointer-events:none;
}

.badge{
    height:31px;
    padding:0 10px;
    display:flex;
    align-items:center;
    gap:7px;
    border-radius:10px;
    background:rgba(8,9,14,.68);
    border:1px solid var(--line);
    backdrop-filter:blur(15px);
    color:#dfe2ed;
    font-size:9px;
}

.badgeDot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--accent2);
    box-shadow:0 0 10px var(--accent2);
}

.playerBtns{
    display:flex;
    gap:5px;
    pointer-events:auto;
}

.icon{
    width:33px;
    height:33px;
    border-radius:10px;
    border:1px solid var(--line);
    background:rgba(8,9,14,.68);
    backdrop-filter:blur(15px);
    color:#dfe3ee;
    cursor:pointer;
    transition:.2s;
}

.icon:hover{
    background:rgba(139,108,255,.16);
    border-color:rgba(139,108,255,.35);
    transform:translateY(-1px);
}

/* EMPTY */

.empty{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.emptyBox{
    max-width:380px;
}

.emptyIcon{
    width:64px;
    height:64px;
    border-radius:20px;
    margin:auto auto 17px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--accent);
    font-size:22px;
    border:1px solid rgba(139,108,255,.18);
    background:rgba(139,108,255,.07);
}

.empty h1{
    font-size:22px;
    margin-bottom:7px;
}

.empty p{
    color:var(--muted);
    font-size:10px;
    line-height:1.9;
}

/* LOADER */

.loader{
    position:absolute;
    inset:0;
    z-index:30;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.15);
}

.spinner{
    width:30px;
    height:30px;
    border:2px solid rgba(255,255,255,.1);
    border-top-color:var(--accent);
    border-right-color:var(--accent2);
    border-radius:50%;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* CINEMA EXIT */

.cinemaExit{
    position:absolute;
    z-index:100;
    top:16px;
    right:16px;
    display:none;
    align-items:center;
    gap:7px;
    height:37px;
    padding:0 13px;
    border-radius:11px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(8,9,14,.78);
    color:#fff;
    backdrop-filter:blur(18px);
    cursor:pointer;
    font-size:10px;
}

.cinemaExit:hover{
    background:rgba(139,108,255,.2);
}

body.cinema .cinemaExit{
    display:flex;
}

/* ERROR */

.error{
    position:absolute;
    z-index:60;
    left:18px;
    right:18px;
    bottom:18px;
    display:none;
    padding:12px 14px;
    border-radius:12px;
    background:rgba(35,10,25,.9);
    border:1px solid rgba(255,70,150,.22);
    color:#ffb5d3;
    font-size:10px;
    backdrop-filter:blur(15px);
}

/* SIDE */

.panel{
    min-height:0;
    border:1px solid var(--line);
    border-radius:23px;
    background:var(--panel);
    backdrop-filter:blur(25px);
    padding:16px;
    display:flex;
    flex-direction:column;
}

.panelTitle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
}

.panelTitle strong{
    font-size:14px;
}

.panelTitle span{
    color:var(--muted);
    font-size:8px;
    letter-spacing:1px;
}

.label{
    color:var(--muted);
    font-size:8px;
    margin-bottom:6px;
}

.inputRow{
    display:flex;
    gap:6px;
}

input{
    flex:1;
    min-width:0;
    height:41px;
    border-radius:11px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.025);
    color:#fff;
    outline:none;
    padding:0 11px;
    direction:ltr;
    font-size:9px;
}

input:focus{
    border-color:rgba(139,108,255,.5);
    box-shadow:0 0 0 3px rgba(139,108,255,.06);
}

.play{
    width:43px;
    height:41px;
    border:0;
    border-radius:11px;
    background:linear-gradient(
        135deg,
        var(--accent),
        #6949df
    );
    color:white;
    cursor:pointer;
    font-size:15px;
}

/* STATUS */

.status{
    height:36px;
    margin-top:8px;
    padding:0 10px;
    border-radius:10px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.025);
    display:flex;
    align-items:center;
    gap:7px;
    color:#9da3b8;
    font-size:8px;
}

.statusDot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--accent2);
    box-shadow:0 0 9px var(--accent2);
}

/* TOOLS */

.tools{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin-top:8px;
}

.tool{
    height:35px;
    border-radius:10px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.025);
    color:#cdd1df;
    cursor:pointer;
    font-size:8px;
    transition:.2s;
}

.tool:hover{
    background:rgba(139,108,255,.08);
    border-color:rgba(139,108,255,.25);
}

/* INFO */

.infoGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin-top:11px;
}

.info{
    padding:9px;
    border-radius:10px;
    background:rgba(255,255,255,.025);
    border:1px solid var(--line);
}

.info small{
    display:block;
    color:var(--muted);
    font-size:7px;
    margin-bottom:4px;
}

.info b{
    font-size:9px;
}

/* HISTORY */

.historyTitle{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:14px 0 7px;
}

.historyTitle b{
    font-size:9px;
}

.historyTitle button{
    border:0;
    background:none;
    color:#666c80;
    cursor:pointer;
    font-size:7px;
}

.history{
    flex:1;
    min-height:0;
    overflow:auto;
    display:flex;
    flex-direction:column;
    gap:5px;
}

.history::-webkit-scrollbar{
    width:3px;
}

.history::-webkit-scrollbar-thumb{
    background:#363a4d;
}

.historyItem{
    padding:8px;
    border-radius:9px;
    background:rgba(255,255,255,.02);
    color:#858a9d;
    font-size:7px;
    direction:ltr;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    cursor:pointer;
    border:1px solid transparent;
}

.historyItem:hover{
    color:#fff;
    background:rgba(139,108,255,.06);
    border-color:rgba(139,108,255,.15);
}

.noHistory{
    text-align:center;
    color:#555a6e;
    font-size:8px;
    padding:15px;
}

/* CINEMA */

body.cinema .header,
body.cinema .panel{
    display:none;
}

body.cinema .main{
    height:100vh;
    padding:0;
}

body.cinema .layout{
    display:block;
    width:100%;
    height:100%;
}

body.cinema .playerShell{
    width:100%;
    height:100%;
    border-radius:0;
}

/* MOBILE */

@media(max-width:850px){

    .header{
        height:55px;
        padding:0 13px;
    }

    .main{
        height:calc(100vh - 55px);
        padding:6px;
    }

    .layout{
        display:block;
        position:relative;
    }

    .playerShell{
        height:100%;
        border-radius:17px;
    }

    .panel{
        position:absolute;
        z-index:80;
        left:8px;
        right:8px;
        bottom:8px;
        height:auto;
        max-height:165px;
        padding:10px;
        border-radius:16px;
    }

    .infoGrid,
    .historyTitle,
    .history{
        display:none;
    }

    .panelTitle{
        margin-bottom:7px;
    }
}
</style>
</head>

<body>

<div class="bg">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
</div>

<header class="header">

    <div class="logo">
        live<span>HUB</span>
    </div>

    <div class="connection">
        <i></i>
        READY
    </div>

</header>


<main class="main">

<div class="layout">

<section class="playerShell">

    <div class="playerTop">

        <div class="badge" id="badge">
            <span class="badgeDot"></span>
            NO SIGNAL
        </div>

        <div class="playerBtns">

            <button
                class="icon"
                id="reload"
                title="Reload">
                ↻
            </button>

            <button
                class="icon"
                id="pip"
                title="Picture in Picture">
                ⧉
            </button>

            <button
                class="icon"
                id="fullscreen"
                title="Fullscreen">
                ⛶
            </button>

        </div>

    </div>


    <button
        class="cinemaExit"
        id="cinemaExit">
        ✕ خروج از حالت سینما
    </button>


    <div id="player">

        <div class="empty">

            <div class="emptyBox">

                <div class="emptyIcon">
                    ▶
                </div>

                <h1>Ready to stream</h1>

                <p>
                    لینک پخش را وارد کنید و استریم را
                    مستقیماً داخل liveHUB اجرا کنید.
                </p>

            </div>

        </div>

    </div>


    <div class="loader" id="loader">
        <div class="spinner"></div>
    </div>


    <div class="error" id="error"></div>

</section>


<aside class="panel">

    <div class="panelTitle">

        <strong>liveHUB</strong>

        <span>STREAM PLAYER</span>

    </div>


    <label class="label">
        STREAM URL
    </label>

    <div class="inputRow">

        <input
            id="url"
            type="text"
            autocomplete="off"
            placeholder="Paste stream URL..."
        >

        <button
            class="play"
            id="play">
            ▶
        </button>

    </div>


    <div class="status" id="status">

        <span class="statusDot"></span>
        آماده پخش

    </div>


    <div class="tools">

        <button class="tool" id="copy">
            کپی لینک
        </button>

        <button class="tool" id="cinema">
            حالت سینما
        </button>

        <button class="tool" id="newTab">
            تب جدید
        </button>

        <button class="tool" id="favorite">
            ☆ علاقه‌مندی
        </button>

    </div>


    <div class="infoGrid">

        <div class="info">

            <small>PLATFORM</small>

            <b id="platform">
                —
            </b>

        </div>

        <div class="info">

            <small>STATUS</small>

            <b id="mode">
                READY
            </b>

        </div>

    </div>


    <div class="historyTitle">

        <b>آخرین لینک‌ها</b>

        <button id="clearHistory">
            پاک کردن
        </button>

    </div>


    <div
        class="history"
        id="history">
    </div>

</aside>

</div>

</main>


<script>

/* =====================================================
   STATE
===================================================== */

let currentURL = "";
let currentType = "";
let currentVideo = null;
let hls = null;


/* =====================================================
   HELPERS
===================================================== */

const $ = id =>
    document.getElementById(id);

function setStatus(text){

    $("status").innerHTML =
        `<span class="statusDot"></span>${text}`;

}

function loading(state){

    $("loader").style.display =
        state ? "flex" : "none";

}

function error(text){

    $("error").textContent = text;
    $("error").style.display = "block";

}

function clearError(){

    $("error").style.display = "none";

}


/* =====================================================
   DESTROY
===================================================== */

function destroy(){

    if(hls){

        try{
            hls.destroy();
        }catch(e){}

        hls = null;

    }

    if(currentVideo){

        try{
            currentVideo.pause();
            currentVideo.removeAttribute("src");
            currentVideo.load();
        }catch(e){}

        currentVideo = null;

    }

}


/* =====================================================
   DETECT
===================================================== */

function detect(url){

    const x =
        url.toLowerCase();

    if(
        x.includes("youtube.com") ||
        x.includes("youtu.be")
    )
        return "YouTube";

    if(x.includes("kick.com"))
        return "KICK";

    if(x.includes("aparat.com"))
        return "Aparat";

    if(x.includes("twitch.tv"))
        return "Twitch";

    if(
        x.includes(".m3u8") ||
        x.includes("m3u8?")
    )
        return "HLS";

    if(
        /\.(mp4|webm|ogg|mov|m4v)(\?|#|$)/i
            .test(x)
    )
        return "VIDEO";

    return "WEB";

}


/* =====================================================
   YOUTUBE
===================================================== */

function youtubeID(url){

    try{

        const u =
            new URL(url);

        if(
            u.hostname.includes("youtu.be")
        ){

            return u.pathname
                .split("/")
                .filter(Boolean)[0] || null;

        }

        const v =
            u.searchParams.get("v");

        if(v)
            return v;

        const match =
            u.pathname.match(
                /\/(?:live|embed|shorts)\/([^/?]+)/
            );

        return match
            ? match[1]
            : null;

    }catch(e){

        return null;

    }

}


function playYouTube(url){

    const id =
        youtubeID(url);

    if(!id){

        error(
            "شناسه YouTube پیدا نشد."
        );

        return;

    }

    $("player").innerHTML = `
        <iframe
            src="https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&playsinline=1&rel=0"
            allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
            allowfullscreen>
        </iframe>
    `;

}


/* =====================================================
   KICK
===================================================== */

function playKick(url){

    try{

        const u =
            new URL(url);

        const channel =
            u.pathname
                .split("/")
                .filter(Boolean)[0];

        if(!channel){

            error(
                "کانال KICK پیدا نشد."
            );

            return;

        }

        $("player").innerHTML = `
            <iframe
                src="https://player.kick.com/${encodeURIComponent(channel)}?autoplay=true&muted=true"
                allow="autoplay; fullscreen; picture-in-picture"
                allowfullscreen>
            </iframe>
        `;

    }catch(e){

        error("لینک KICK معتبر نیست.");

    }

}


/* =====================================================
   APARAT
===================================================== */

function aparatChannel(url){

    try{

        const u =
            new URL(url);

        const p =
            u.pathname
                .split("/")
                .filter(Boolean);

        const low =
            p.map(x=>x.toLowerCase());

        const live =
            low.indexOf("live");

        if(
            live > 0 &&
            p[live-1] !== "embed"
        )
            return p[live-1];

        if(
            low[0] === "embed" &&
            low[1] === "live" &&
            p[2]
        )
            return p[2];

        return p[0] || null;

    }catch(e){

        return null;

    }

}


function playAparat(url){

    const channel =
        aparatChannel(url);

    if(!channel){

        error(
            "کانال آپارات پیدا نشد."
        );

        return;

    }

    $("player").innerHTML = `
        <iframe
            src="https://www.aparat.com/embed/live/${encodeURIComponent(channel)}"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen>
        </iframe>
    `;

}


/* =====================================================
   TWITCH
===================================================== */

function playTwitch(url){

    try{

        const u =
            new URL(url);

        const channel =
            u.pathname
                .split("/")
                .filter(Boolean)[0];

        if(!channel){

            error(
                "کانال Twitch پیدا نشد."
            );

            return;

        }

        const parent =
            location.hostname ||
            "localhost";

        $("player").innerHTML = `
            <iframe
                src="https://player.twitch.tv/?channel=${encodeURIComponent(channel)}&parent=${encodeURIComponent(parent)}&autoplay=true"
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>
        `;

    }catch(e){

        error(
            "لینک Twitch معتبر نیست."
        );

    }

}


/* =====================================================
   HLS
===================================================== */

function playHLS(url){

    $("player").innerHTML = `
        <video
            id="streamVideo"
            controls
            autoplay
            playsinline>
        </video>
    `;

    currentVideo =
        $("streamVideo");

    currentVideo.src = url;

    currentVideo.addEventListener(
        "playing",
        ()=>{
            loading(false);
            setStatus("در حال پخش");
            $("mode").textContent = "LIVE";
        }
    );

    currentVideo.addEventListener(
        "waiting",
        ()=>{
            setStatus(
                "در حال بافر..."
            );
        }
    );

    currentVideo.addEventListener(
        "error",
        ()=>{
            loading(false);
            setStatus("خطای استریم");
            error(
                "دریافت مستقیم استریم با مشکل مواجه شد."
            );
        }
    );

    if(
        currentVideo.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        currentVideo.play()
            .catch(()=>{});

        return;

    }

    const script =
        document.createElement("script");

    script.src =
        "https://cdn.jsdelivr.net/npm/hls.js@latest";

    script.onload = ()=>{

        if(
            !window.Hls ||
            !Hls.isSupported()
        ){

            loading(false);

            error(
                "مرورگر شما HLS را پشتیبانی نمی‌کند."
            );

            return;

        }

        hls =
            new Hls({
                enableWorker:true,
                lowLatencyMode:true,
                backBufferLength:30,
                maxBufferLength:20
            });

        hls.loadSource(url);

        hls.attachMedia(
            currentVideo
        );

        hls.on(
            Hls.Events.MANIFEST_PARSED,
            ()=>{
                currentVideo
                    .play()
                    .catch(()=>{});
            }
        );

        hls.on(
            Hls.Events.ERROR,
            (event,data)=>{

                if(!data.fatal)
                    return;

                if(
                    data.type ===
                    Hls.ErrorTypes.NETWORK_ERROR
                ){

                    setStatus(
                        "اتصال قطع شد؛ تلاش مجدد..."
                    );

                    hls.startLoad();

                }else if(
                    data.type ===
                    Hls.ErrorTypes.MEDIA_ERROR
                ){

                    hls.recoverMediaError();

                }else{

                    error(
                        "خطای HLS."
                    );

                }

            }
        );

    };

    script.onerror = ()=>{

        loading(false);

        error(
            "کتابخانه HLS بارگذاری نشد."
        );

    };

    document.head.appendChild(
        script
    );

}


/* =====================================================
   DIRECT VIDEO
===================================================== */

function playVideo(url){

    $("player").innerHTML = `
        <video
            id="streamVideo"
            controls
            autoplay
            playsinline
            preload="auto">
        </video>
    `;

    currentVideo =
        $("streamVideo");

    currentVideo.src = url;

    currentVideo.addEventListener(
        "playing",
        ()=>{
            loading(false);
            setStatus("در حال پخش");
            $("mode").textContent = "PLAYING";
        }
    );

    currentVideo.addEventListener(
        "waiting",
        ()=>{
            setStatus(
                "در حال بافر..."
            );
        }
    );

    currentVideo.addEventListener(
        "error",
        ()=>{
            loading(false);
            setStatus("خطا");
            error(
                "ویدیو قابل دریافت نیست."
            );
        }
    );

    currentVideo.play()
        .catch(()=>{});

}


/* =====================================================
   GENERIC
===================================================== */

function playWeb(url){

    $("player").innerHTML = `
        <iframe
            src="${escapeHTML(url)}"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen>
        </iframe>
    `;

}


/* =====================================================
   START
===================================================== */

function start(){

    const url =
        $("url").value.trim();

    if(!url){

        setStatus(
            "یک لینک وارد کنید."
        );

        return;

    }

    let parsed;

    try{

        parsed =
            new URL(url);

    }catch(e){

        setStatus(
            "URL معتبر نیست."
        );

        return;

    }

    currentURL =
        parsed.href;

    currentType =
        detect(currentURL);

    clearError();
    destroy();

    loading(true);

    $("badge").innerHTML =
        `<span class="badgeDot"></span>${currentType}`;

    $("platform").textContent =
        currentType;

    $("mode").textContent =
        "LOADING";

    setStatus(
        "در حال اتصال..."
    );


    switch(currentType){

        case "YouTube":
            playYouTube(currentURL);
            break;

        case "KICK":
            playKick(currentURL);
            break;

        case "Aparat":
            playAparat(currentURL);
            break;

        case "Twitch":
            playTwitch(currentURL);
            break;

        case "HLS":
            playHLS(currentURL);
            break;

        case "VIDEO":
            playVideo(currentURL);
            break;

        default:
            playWeb(currentURL);

    }


    saveHistory(
        currentURL
    );


    /*
       برای iframeها نمی‌توان از
       window.onerror خطای واقعی
       پلیر داخلی را تشخیص داد.
       بنابراین خطای جعلی نشان نمی‌دهیم.
    */

    if(
        ["YouTube","KICK","Aparat","Twitch","WEB"]
            .includes(currentType)
    ){

        setTimeout(
            ()=>{
                loading(false);
                setStatus(
                    "پلیر آماده است"
                );
                $("mode").textContent =
                    "READY";
            },
            2200
        );

    }

}


/* =====================================================
   CINEMA
===================================================== */

function enterCinema(){

    document.body.classList.add(
        "cinema"
    );

}

function exitCinema(){

    document.body.classList.remove(
        "cinema"
    );

}


/* =====================================================
   FULLSCREEN
===================================================== */

function fullscreen(){

    const target =
        document.querySelector(
            ".playerShell"
        );

    if(!document.fullscreenElement){

        target.requestFullscreen?.();

    }else{

        document.exitFullscreen?.();

    }

}


/* =====================================================
   PIP
===================================================== */

async function pip(){

    if(
        !currentVideo ||
        !document.pictureInPictureEnabled
    ){

        setStatus(
            "PiP برای این پلیر در دسترس نیست."
        );

        return;

    }

    try{

        if(
            document.pictureInPictureElement
        ){

            await document
                .exitPictureInPicture();

        }else{

            await currentVideo
                .requestPictureInPicture();

        }

    }catch(e){

        setStatus(
            "PiP در دسترس نیست."
        );

    }

}


/* =====================================================
   COPY
===================================================== */

async function copyURL(){

    if(!currentURL)
        return;

    try{

        await navigator.clipboard
            .writeText(
                currentURL
            );

        setStatus(
            "لینک کپی شد"
        );

        setTimeout(
            ()=>{
                setStatus(
                    "در حال پخش"
                );
            },
            1200
        );

    }catch(e){}

}


/* =====================================================
   NEW TAB
===================================================== */

function newTab(){

    if(currentURL)
        window.open(
            currentURL,
            "_blank"
        );

}


/* =====================================================
   FAVORITE
===================================================== */

function favorite(){

    if(!currentURL)
        return;

    let fav =
        JSON.parse(
            localStorage.getItem(
                "livehub_favorites"
            ) || "[]"
        );

    if(
        fav.includes(currentURL)
    ){

        fav =
            fav.filter(
                x => x !== currentURL
            );

        setStatus(
            "از علاقه‌مندی حذف شد"
        );

    }else{

        fav.unshift(
            currentURL
        );

        fav =
            fav.slice(0,10);

        setStatus(
            "به علاقه‌مندی اضافه شد"
        );

    }

    localStorage.setItem(
        "livehub_favorites",
        JSON.stringify(fav)
    );

}


/* =====================================================
   HISTORY
===================================================== */

function saveHistory(url){

    let items =
        JSON.parse(
            localStorage.getItem(
                "livehub_history"
            ) || "[]"
        );

    items =
        items.filter(
            x => x !== url
        );

    items.unshift(url);

    items =
        items.slice(0,8);

    localStorage.setItem(
        "livehub_history",
        JSON.stringify(items)
    );

    renderHistory();

}


function renderHistory(){

    const box =
        $("history");

    let items =
        JSON.parse(
            localStorage.getItem(
                "livehub_history"
            ) || "[]"
        );

    if(!items.length){

        box.innerHTML =
            `<div class="noHistory">
                هنوز لینکی پخش نشده
            </div>`;

        return;

    }

    box.innerHTML =
        items.map(
            url => `
                <div
                    class="historyItem"
                    data-url="${escapeHTML(url)}">
                    ${escapeHTML(url)}
                </div>
            `
        ).join("");

    box
        .querySelectorAll(
            ".historyItem"
        )
        .forEach(item => {

            item.onclick = ()=>{

                $("url").value =
                    item.dataset.url;

                start();

            };

        });

}


function clearHistory(){

    localStorage.removeItem(
        "livehub_history"
    );

    renderHistory();

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   EVENTS
===================================================== */

$("play").onclick =
    start;

$("url").addEventListener(
    "keydown",
    e=>{
        if(e.key === "Enter")
            start();
    }
);

$("reload").onclick =
    ()=>{
        if(currentURL)
            start();
    };

$("fullscreen").onclick =
    fullscreen;

$("pip").onclick =
    pip;

$("copy").onclick =
    copyURL;

$("cinema").onclick =
    enterCinema;

$("cinemaExit").onclick =
    exitCinema;

$("newTab").onclick =
    newTab;

$("favorite").onclick =
    favorite;

$("clearHistory").onclick =
    clearHistory;


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    e=>{

        if(
            document.activeElement ===
            $("url")
        )
            return;

        if(e.key.toLowerCase()==="f")
            fullscreen();

        if(e.key.toLowerCase()==="c")
            enterCinema();

        if(e.key.toLowerCase()==="r")
            if(currentURL)
                start();

        if(e.key.toLowerCase()==="p")
            pip();

        if(e.key === "Escape")
            exitCinema();

        if(e.key.toLowerCase()==="m"){

            if(currentVideo)
                currentVideo.muted =
                    !currentVideo.muted;

        }

    }
);


/* =====================================================
   INIT
===================================================== */

renderHistory();

</script>

</body>
</html>
